[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caiman-context"
version = "0.1.0"
description = "Versioned document context for firmware coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=4.2,<5",
    "textual>=8.2.8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[project.scripts]
caiman = "caiman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
